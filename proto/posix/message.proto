}

message TenantCredentials {
  bytes accessKey = 1;
  bytes secretKey = 2;
  bytes dataKey = 3;
  bool isCredential = 4; // is credential enabled
}

message DeployInstanceResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
  string timeInfo = 4;
  string instanceID = 5;
  string runtimeID = 6;
  string address = 7;
  string cpuType = 8;
  int64  pid = 9;

// Snapshot metadata stored in etcd
message FunctionKey {
  string tenantID     = 1;
  string functionType = 2;  // moduleName.className for actors; functionName for FaaS
  string namespace    = 3;  // optional actor namespace
}

message SnapshotMetadata {
  resources.InstanceInfo instanceInfo = 1; // 实例信息
  resources.SnapshotInfo snapshotInfo = 2; // 快照信息
  FunctionKey            functionKey  = 3;
}


message SnapshotArtifact {
  string storageBackend = 1;
  string objectKey = 2;
  int64 size = 3;
  string sha256 = 4;
  string format = 5;
  uint32 formatVersion = 6;
  // Required only for local storage; identifies the node that owns the file.
  string sourceNodeID = 7;
}

// Reusable Snapshot has an independent four-state lifecycle. Pause/Resume
// continues to use resources.SnapshotStatus unchanged.
enum ReusableSnapshotPhase {
  REUSABLE_SNAPSHOT_PHASE_UNSPECIFIED = 0;
  REUSABLE_SNAPSHOT_PUBLISHING = 1;
  REUSABLE_SNAPSHOT_READY = 2;
  REUSABLE_SNAPSHOT_DELETING = 3;
}

message ReusableSnapshotMetadata {
  string snapshotID = 1;
  repeated string names = 2;
  resources.InstanceInfo instanceTemplate = 3;
  SnapshotArtifact artifact = 4;
  string tenantID = 5;
  string createRequestID = 6;
  ReusableSnapshotPhase phase = 7;
  int64 createTime = 8;
  int64 updateTime = 9;
  uint64 version = 10;
  string sourceInstanceID = 11;
}

message ReusableSnapshotRestore {
  string snapshotID = 1;
  SnapshotArtifact artifact = 2;
  bool allowLogicalInstanceIDRebind = 3;
}


message BeginReusableSnapshotRequest {
  string requestID = 1;
  string tenantID = 2;
  string sourceInstanceID = 3;
  repeated string names = 4;
}

message BeginReusableSnapshotResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
  string snapshotID = 4;
  ReusableSnapshotPhase phase = 5;
  core_service.SnapshotInfo snapshotInfo = 6;
}

message CommitReusableSnapshotRequest {
  string requestID = 1;
  string tenantID = 2;
  string snapshotID = 3;
  resources.InstanceInfo sourceInstanceInfo = 4;
  SnapshotArtifact artifact = 5;
}

message CommitReusableSnapshotResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
  core_service.SnapshotInfo snapshotInfo = 4;
  uint64 version = 5;
}

message FailReusableSnapshotRequest {

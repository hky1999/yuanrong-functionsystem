syntax = "proto3";

import "common.proto";
import "core_service.proto";
import "resource.proto";
import "sandbox_api.proto";

package messages;
option go_package = "functionsystem/pkg/common/faas_common/grpc/pb/message;message";

message ResourceView {}

// Internal, node-budgeted command. The scheduler must reserve before sending
// and reconcile UNKNOWN outcomes instead of treating a timeout as no write.
message ResizeSandboxRequest {
  string requestID = 1;
  string instanceID = 2;
  string runtimeID = 3;
  runtime.v1.ResizeResourcesRequest resize = 4;
  // Explicit operation type carried through every forwarding layer: false is a
  // grow dispatched as ResizeResources, true is a shrink dispatched as the
  // separate ShrinkResources RPC. The embedded command payload is shared
  // because both external requests use the same fields 1-7.
  bool shrink = 5;
}

message ResizeSandboxResponse {
  enum Outcome {
    UNKNOWN = 0;
    REJECTED_BEFORE_DISPATCH = 1;
    OBSERVED = 2;
  }
  string requestID = 1;
  string instanceID = 2;
  string runtimeID = 3;
  string sandboxID = 4;
  string resourceGeneration = 5;
  int32 code = 6;
  string message = 7;
  Outcome outcome = 8;
  runtime.v1.ResizeResourcesResponse result = 9;
}


// common message
message ScheduleTopology {
  message Scheduler {
    string name = 1;
    string address = 2;
  }
  Scheduler leader = 1;
  repeated Scheduler members = 2;
}

message Register {
  string name = 1;
  string address = 2;
  resources.ResourceUnit resource = 3;
  string message = 4;
  // multiple resource view is add for primary and virtual
  // 3 was reserve for former compatible
  map<int32, resources.ResourceUnit> resources = 5;
}

message Registered {
  int32 code = 1;
  string message = 2;
  ScheduleTopology topo = 3;
}

message AffinityContext {
  map<string, int64> scheduledScore = 1;
  map<string, int32> scheduledResult = 2;
  int64 maxScore = 3;
  bool isTopDownScheduling = 4;
}

message DefaultPluginContext {
  map<string, int32> filterCtx = 1;
}

message GroupScheduleContext {
  string reserved = 1;
}

message PluginContext {
    oneof PluginContext {
        AffinityContext affinityCtx = 1;
        DefaultPluginContext defaultCtx = 2;
        GroupScheduleContext groupSchedCtx = 3;
    }
}

message ScheduleRequest {
  resources.InstanceInfo        instance                = 1;
  // initRequest should be deprecated
  bytes                         initRequest             = 2;
  string                        requestID               = 3;
  string                        traceID                 = 4;
  map<int32, resources.ResourceUnitChanges> updateResources = 5;
  string                        sourceName              = 6;
  uint32                        scheduleRound           = 7;
  // context of scheduler result to avoid
  // duplicate scheduling resource conflict or fragment.
  // key is plugin name
  map<string, PluginContext>    contexts                = 8;
  // Indicates whether the current request is a range schedule.
  bool                          isInsRangeScheduler     = 9;
  // store the range schedule infos
  RangeOptions                  rangeOpts               = 10;
  // candidate result of Scheduler
  CandidateResult               candidateResult         = 11;
  // domain send current revision to local so that local use revision to update resourceUnitChange
  PullResourceRequest           unitSnapshot            = 12;
}

message CandidateResult {
  // store candidate resource unit id
  string unitID = 1;
}

message RangeOptions {
  core_service.InstanceRange      range                  = 1;
  int32                           curRangeInstanceNum    = 2;
}

message ScheduleResult
{
  string nodeId = 1;
  repeated common.HeteroDeviceInfo devices = 2;
}

message ScheduleResponse {
  int32            code = 1;
  string           message = 2;
  string           requestID = 3;
  string           instanceID = 4;
  map<int32, resources.ResourceUnitChanges> updateResources = 5;
  // context of scheduler result to avoid
  // duplicate scheduling resource conflict or fragment.
  // key is plugin name
  map<string, PluginContext> contexts = 6;
  ScheduleResult scheduleResult = 7;
  string traceID   = 8;
}

message Reserves {
  repeated ScheduleRequest reserves = 1;
  string requestID = 2;
  string traceID = 3;
  string groupID = 4;
  resources.CreateTarget target = 5;
  repeated string instanceIDs = 6;
}

message OnReserves {
  repeated ScheduleResponse responses = 1;
  map<int32, resources.ResourceUnitChanges> updateResources = 2;
  string requestID = 3;
  string traceID = 4;
}

message NotifySchedAbnormalRequest {
  string schedName = 1;
  string ip        = 2;
}

message NotifySchedAbnormalResponse {
  string schedName = 1;
  string ip        = 2;
}

message NotifyWorkerStatusRequest {
  bool  healthy = 1;
  string workerIP = 2;
}

message NotifyWorkerStatusResponse {
  bool   healthy   = 1;
  string workerIP  = 2;
}

message UpdateNodeTaintRequest {
  string requestID  = 1;
  bool   healthy    = 2;
  string ip         = 3;
  string key        = 4;
}

message UpdateNodeTaintResponse {
  string requestID  = 1;
  int32  code       = 2;
  string message    = 3;
}

// common end

// domain scheduler and scaler message begin
message CreateAgentRequest {
  resources.InstanceInfo instanceInfo = 1;

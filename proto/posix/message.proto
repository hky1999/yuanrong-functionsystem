  int32 code = 1;
  string message = 2;
  string requestID = 3;
  resources.InstanceInfo instanceTemplate = 4;
  ReusableSnapshotRestore reusableSnapshotRestore = 5;
  uint64 snapshotVersion = 6;
}

message LocalSnapshotMetadata {
  reserved 4, 5, 6, 8, 14, 15;
  reserved "generation", "runtimeClass", "architecture", "sha256",
      "artifactFormat", "artifactFormatVersion";

  string snapshotID = 1;
  bool localRecoveryCandidate = 2;
  string instanceID = 3;
  uint64 size = 7;
  int64 createdAtUnixSeconds = 9;
  string sourceRuntimeID = 10;
  string sourceSandboxID = 11;
  int64 sourceInstanceVersion = 12;
  string tenantHash = 13;
  string storageBackend = 16;
  string objectKey = 17;
}

message ListLocalSnapshotsRequest {
  string requestID = 1;
}

message ListLocalSnapshotsResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
  repeated LocalSnapshotMetadata snapshots = 4;
}

message DeleteLocalSnapshotRequest {
  reserved 3, 4, 5;
  reserved "expectedGeneration", "expectedSize", "expectedSha256";

  string requestID = 1;
  string snapshotID = 2;
}

message DeleteLocalSnapshotResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
}


message SnapshotRuntimeRequest {
  reserved 9;
  reserved "agentRequestGeneration";

  string requestID = 1;
  string runtimeID = 2;
  string instanceID = 3;
  string containerID = 4;
  int32 ttl = 5;
  common.SnapType type = 6;  // interpreted by FunctionProxy only
  string snapshotID = 7;
  string checkpointDir = 8;
  string tenantID = 10;
  int64 sourceVersion = 11;
  bool leaveRunning = 12;
  bool localRecoveryCandidate = 13;
  // FunctionProxy resolves business-specific keys. FunctionAgent treats both
  // keys as opaque storage instructions.
  string artifactObjectKey = 14;
  string artifactTemporaryObjectKey = 15;
  bool returnArtifact = 16;
  uint64 timeoutMs = 17;
  // Internal checkpoints are retained only as node-local recovery candidates.
  // They never enter the compression or distributed publication phase.
  bool internalCheckpoint = 18;
}

// Starts the storage phase for a checkpoint that has already reached
// LOCAL_READY. FunctionProxy sends this only after completing the runtime
// handoff required by the checkpoint purpose.
message PublishSnapshotArtifactRequest {
  string requestID = 1;
  string snapshotID = 2;
  string instanceID = 3;

  bool leaveRunning = 6;
  string expected_sandbox_id = 7;
  string expected_resource_generation = 8;
}

message SnapshotRuntimeResponse {
  reserved 7, 8;
  reserved "agentRequestGeneration", "localArtifactPath";

  int32 code = 1;
  string message = 2;
  string requestID = 3;
  resources.SnapshotInfo snapshotInfo = 4;
  bool resultUnknown = 5;
  // PhysicalFact is populated only after an authoritative List on failure.
  // Successful PAUSE_RESUME responses use durable snapshotInfo and never
  // expose a node-local path or fabricate a sandbox lifecycle state.
  SandboxPhysicalFact physicalFact = 6;
  SnapshotArtifact reusableSnapshotArtifact = 9;
  LocalSnapshotMetadata localSnapshot = 10;
  // True only for a definitive rejection before the checkpoint RPC was sent.
  // False includes older peers and unknown or already-started operations.
  bool checkpointNotStarted = 11;
}

// Internal-only physical facts returned by sandboxd List reconciliation.
// This intentionally contains no credentials, environment variables, or
// persisted operation phase.
message SandboxPhysicalFact {
  reserved 4, 5;
  reserved "localArtifactPath", "localArtifactPresent";

  string sandboxID = 1;
  runtime.v1.SandboxState state = 2;
  map<string, string> labels = 3;
}

message RestoreSnapshotRequest {
  string requestID = 1;
  string checkpointID = 2;
  core_service.SnapStartOptions snapStartOptions = 3;
}

message RestoreSnapshotResponse {
  reserved 4;
  reserved "instanceID";

  int32 code = 1;
  string message = 2;
  string requestID = 3;
  core_service.SnapStartedInfo snapstartInfo = 5;
}

message RecordSnapshotRequest {
  string requestID = 1;
  resources.SnapshotInfo snapshotInfo = 2;
  resources.InstanceInfo instanceInfo = 3;
  FunctionKey            functionKey  = 4;
}

message RecordSnapshotResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
}


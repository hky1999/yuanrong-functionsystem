message BeginDeleteReusableSnapshotRequest {
  string requestID = 1;
  string tenantID = 2;
  string snapshotID = 3;
}

message BeginDeleteReusableSnapshotResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
  SnapshotArtifact artifact = 4;

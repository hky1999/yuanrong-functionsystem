  repeated string            checkpointIDs = 4;
}

message DeleteSnapshotRequest {
  string requestID = 1;
  string checkpointID = 2;
}

message DeleteSnapshotResponse {
  common.ErrorCode code = 1;
  string message = 2;
  string requestID = 3;
}

message TenantQuotaExceeded {
    string tenantID   = 1;
    int64  cooldownMs = 2;
}

// Internal-only FunctionProxy -> FunctionAgent attempt finalization.
enum SnapshotAttemptFinalizeOperation {
  SNAPSHOT_ATTEMPT_FINALIZE_OPERATION_UNSPECIFIED = 0;
  PAUSE_COMMITTED = 1;
  PAUSE_ABORTED = 2;
  RESUME_COMMITTED = 3;
  RESUME_ABORTED = 4;
  PAUSED_DELETED = 5;
  REUSABLE_SNAPSHOT_COMMITTED = 6;
  REUSABLE_SNAPSHOT_ABORTED = 7;
}

message SnapshotAttemptFinalizeRequest {
  uint32 protocolVersion = 1;
  SnapshotAttemptFinalizeOperation operation = 2;
  string tenantID = 3;
  string instanceID = 4;
  string snapshotID = 5;
  string attemptID = 6;
  string runtimeID = 7;
  uint64 expectedSize = 8;
  string expectedSha256 = 9;
  string expectedStorage = 10;
  bool deleteLocalArtifact = 11;
  bool deleteRuntime = 12;
  repeated string deleteRemoteObjectKeys = 13;
}

message SnapshotAttemptFinalizeResponse {
  int32 code = 1;
  string message = 2;
  bool resultUnknown = 3;
  bool localCleanupComplete = 4;
  bool remoteCleanupComplete = 5;
  string attemptID = 6;
}

// ── Runtime reconciliation ──────────────────────────────────────────

message RuntimeReconcileEntry {
  string runtimeID    = 1;
  string containerID  = 2;  // executor implementation identifier (sandboxID for sandbox executor)
  string instanceID   = 3;
  string portMappings = 4;  // persisted host-port ownership JSON

  string portMappings = 4;  // persisted JSON port mappings for runtime-manager reconstruction
}

message ReconcileRuntimesRequest {
  string requestID                         = 1;
  repeated RuntimeReconcileEntry entries   = 2;
}

message ReconcileRuntimesResponse {
  string requestID           = 1;
  int32  code                = 2;
  string message             = 3;
  int32  orphansCleaned      = 4;
  repeated string orphanIDs  = 5;  // cleaned orphan containerIDs
  repeated string missingIDs = 6;  // expected but not found containerIDs
  repeated RuntimeReconcileEntry confirmedEntries = 7;  // confirmed running entries
  repeated SandboxPhysicalFact physicalFacts = 8;  // current List facts; transient states are not persisted
}

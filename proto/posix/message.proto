}

message FailReusableSnapshotResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
}

message GetReusableSnapshotRequest {
  string requestID = 1;
  string tenantID = 2;
  string snapshotID = 3;
}

message GetReusableSnapshotResponse {
  int32 code = 1;
  string message = 2;
  string requestID = 3;
  core_service.SnapshotInfo snapshotInfo = 4;
}

message ListReusableSnapshotsRequest {
  string requestID = 1;

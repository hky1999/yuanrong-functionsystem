// LinuxSandboxResources describes Linux resource settings for a sandbox.
message LinuxSandboxResources {
  // CPUPeriod is the CPU CFS period in microseconds.
  uint64 cpu_period = 1;
  // CPUQuota is the CPU CFS quota in microseconds.
  int64 cpu_quota = 2;
  // CPUShares is the relative CPU share weight.
  uint64 cpu_shares = 3;
  // MemoryLimitInBytes is the memory limit in bytes.
  int64 memory_limit_in_bytes = 4;
  // OomScoreAdj is the OOM score adjustment.
  int64 oom_score_adj = 5;
  // CpusetCpus is the allowed CPU set.
  string cpuset_cpus = 6;
  // CpusetMems is the allowed memory node set.
  string cpuset_mems = 7;
  // HugepageLimits contains hugepage limits by page size.
  repeated HugepageLimit hugepage_limits = 8;
  // Unified contains cgroup v2 unified controller settings.
  map<string, string> unified = 9;
  // MemorySwapLimitInBytes is the memory plus swap limit in bytes.
  int64 memory_swap_limit_in_bytes = 10;
}

// HugepageLimit describes a hugepage limit for one page size.
message HugepageLimit {
  // PageSize is the hugepage size.
  string page_size = 1;
  // Limit is the hugepage limit in bytes.
  uint64 limit = 2;
}

// SandboxMetadata contains the persisted metadata for a sandbox.
message SandboxMetadata {
  // ID is the sandbox ID.
  string id = 1;
  // RuntimeHandler is the runtime handler name.
  string runtime_handler = 3;
  // Labels contains sandbox labels.
  map<string, string> labels = 4;
  // Stdout is the configured stdout redirect path.
  string stdout = 6;
  // Stderr is the configured stderr redirect path.
  string stderr = 7;
  // MetricLabels contains sandbox metadata intended for metric dimensions.
  map<string, string> metric_labels = 8;
}

// SandboxMetadataList contains persisted sandbox metadata entries.
message SandboxMetadataList {
  // Sandboxes maps sandbox ID to sandbox metadata.
  map<string, SandboxMetadata> sandboxes = 1;
}

// StatsRequest describes a sandbox stats request.
message StatsRequest {
  // ID is the sandbox ID.
  string id = 1;
}

// StatsResponse contains sandbox resource usage statistics.
message StatsResponse {
  // Total CPU usage in nanoseconds.
  uint64 cpu_usage_ns = 1;
  // Current memory usage in bytes.
  uint64 memory_usage_bytes = 2;
  // Memory limit in bytes.
  uint64 memory_limit_bytes = 3;
  // Maximum memory usage observed in bytes.
  uint64 memory_max_usage_bytes = 4;
  // CPU usage in kernel mode in nanoseconds.
  uint64 cpu_kernel_ns = 5;
  // CPU usage in user mode in nanoseconds.
  uint64 cpu_user_ns = 6;
  // Effective cgroup CPU quota/period in microseconds. Quota -1 is unlimited.
  // A false known flag distinguishes unsupported/missing readings from zero.
  int64 cpu_quota_usec = 7;
  uint64 cpu_period_usec = 8;
  bool cpu_limits_known = 9;

  // Server-owned physical incarnation; changes whenever an ID is recreated.
  string resource_generation = 10;
  // Persisted elastic initial/ceiling policy, empty for non-elastic sandboxes.
  string elastic_policy = 11;
  // Cumulative pressure counters for this physical generation; false means unknown.
  bool cpu_pressure_known = 12;
  uint64 cpu_periods = 13;
  uint64 cpu_throttled_periods = 14;
  uint64 cpu_throttled_ns = 15;
  bool memory_pressure_known = 16;
  uint64 memory_high_events = 17;
  uint64 memory_oom_events = 18;
  uint64 memory_oom_kill_events = 19;

  // Per-reading observation flags: false means the reading is unsupported or
  // missing, not zero. Old servers leave them unset, so their zero numerics
  // must not be treated as observations.
  bool cpu_usage_known = 20;
  bool memory_usage_known = 21;
  bool memory_limit_known = 22;
  bool memory_peak_known = 23;

  // Monotonic per-incarnation resource revision. Every accepted resource
  // operation intent persists the next revision before side effects. Old
  // instances that predate revision tracking report known = false.
  uint64 resource_revision = 24;
  bool resource_revision_known = 25;
  // Effective memory.high soft limit. Unlimited is expressed by its own flag,
  // never disguised as a finite zero.
  uint64 memory_high_bytes = 26;
  bool memory_high_known = 27;
  bool memory_high_unlimited = 28;
  // cgroup.freeze observation at read time.
  bool frozen = 29;
  bool frozen_known = 30;
  // Identity and terminal state of the last resource operation. A pending
  // flag of true means an operation is unfinished; callers must not treat a
  // numerically matching target as closed while pending is true.
  string resource_operation_id = 31;
  bool resource_operation_pending = 32;
  // Daemon-proven absolute cgroup v2 directory of the memory controller.
  // Empty means unavailable. Read-only positioning evidence for event
  // watchers; it never authorizes any resource write.
  string memory_cgroup_path = 33;
}

// ListAvailableRuntimesRequest requests the runtime classes currently available
// for new sandbox creation.
message ListAvailableRuntimesRequest {}

// RuntimeInfo describes one initialized runtime handler and its optional
// checkpoint/restore application handoff interface.
message RuntimeInfo {
  string runtime_class = 1;
  bool supports_checkpoint_restore = 2;
  string checkpoint_handoff_path = 3;
  string restore_env_path = 4;
}

// ListAvailableRuntimesResponse contains the available runtime class snapshot.
message ListAvailableRuntimesResponse {
  // RuntimeClasses contains the sorted handler names accepted by sandbox start requests.
  // Configured runtime classes whose handlers failed to initialize are excluded.
  repeated string runtime_classes = 1;
  repeated RuntimeInfo runtimes = 2;
}

// DeleteCheckpointRequest identifies one exact sandboxd-owned artifact.
message DeleteCheckpointRequest {
  string checkpoint_dir = 1;
  string checkpoint_id = 2;
  string source_sandbox_id = 3;
  int64 expected_size = 4;
  string expected_sha256 = 5;
}

message DeleteCheckpointResponse {}

// ResourceLimits uses kernel cgroup units and finite, positive limits only.
message ResourceLimits {
  int64 cpu_quota_usec = 1;
  uint64 cpu_period_usec = 2;
  uint64 memory_limit_bytes = 3;
}

// The scheduler must reserve node capacity before sending this request. A
// transport failure is an uncertain outcome: retain reservation until Stats
// reconciles it. Matching target retries are idempotent within an incarnation.
message ResizeResourcesRequest {
  string sandbox_id = 1;
  string resource_generation = 2;
  ResourceLimits expected = 3;
  ResourceLimits target = 4;
  // Required absolute command expiry, checked again under the resource lock.
  int64 deadline_unix_ms = 5;
  // Unique per attempt; the daemon binds it to the full request fingerprint
  // (generation, expected_revision, values, deadline, direction) and rejects
  // a reused ID with a different fingerprint.
  string operation_id = 6;
  // CAS against the incarnation's current resource revision.
  uint64 expected_revision = 7;
}

// Field-identical to ResizeResourcesRequest. Kept as an independent message so
// the wire contract records shrink as its own operation type.
message ShrinkResourcesRequest {
  string sandbox_id = 1;
  string resource_generation = 2;
  ResourceLimits expected = 3;
  // target memory must be below expected; CPU values must be equal.
  ResourceLimits target = 4;
  // Required absolute command expiry, checked again under the resource lock.
  int64 deadline_unix_ms = 5;
  string operation_id = 6;
  uint64 expected_revision = 7;
}

message ResizeResourcesResponse {
  StatsResponse actual = 1;
  // Complete includes successful soft-limit application and hard-limit readback.
  bool complete = 2;
  // A partial write is returned with actual limits, never disguised as no-op.
  string update_error = 3;
}

// Deletes only the physical incarnation identified by expected_generation.
message DeleteIfGenerationRequest {
  string id = 1;
  string expected_generation = 2;
}
message DeleteIfGenerationResponse {
  string retired_generation = 1;
}

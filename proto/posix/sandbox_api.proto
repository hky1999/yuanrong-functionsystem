// WaitResponse is returned after waiting for a sandbox.
message WaitResponse {
  // Status is the sandbox wait status.
  int32 status = 1;
  // Exit code of the sandbox. Only required when finished_at != 0. Default: 0.
  int32 exit_code = 2;
  // Message contains details about the sandbox state.
  string message = 3;
}

// SandboxTemplate describes a reusable sandbox template registered in sandboxd.
message SandboxTemplate {
  // ID is the registered template ID.
  string id = 1;
  // Runtime is the runtime handler name, such as runsc.
  string runtime = 2;
  // Rootfs is the root filesystem source used by the template.
  RootfsConfig rootfs = 3;
  // MakeSeed asks sandboxd to pre-create a seed sandbox when supported.
  bool make_seed = 4;
  // Command is the executable and arguments to run inside the sandbox.
  repeated string command = 5;
  // Envs contains environment variables for the sandbox process.
  map<string, string> envs = 6;
  // Cwd is the working directory inside the sandbox.
  string cwd = 7;
  // Mounts contains additional mounts attached to the sandbox.
  repeated Mount mounts = 8;
}

// RegisterRequest describes sandbox template registration.
message RegisterRequest {
  // Templates contains sandbox templates to register.
  repeated SandboxTemplate templates = 1;
}

// NormalResponse is returned by template registration operations.
message NormalResponse {
  bool   success = 1;
  string message = 2;
}

// UnregisterRequest describes sandbox template removal.
message UnregisterRequest {
  // IDs contains sandbox template IDs to unregister.
  repeated string ids = 1;
}

// GetRegisteredRequest describes a registered sandbox template list request.
message GetRegisteredRequest {}

// GetRegisteredResponse contains registered sandbox templates.
message GetRegisteredResponse {
  // Templates contains registered sandbox templates.
  repeated SandboxTemplate templates = 1;
}

// CheckpointRequest describes a synchronous checkpoint operation.
message CheckpointRequest {
  // ID is the source sandbox ID.
  string id = 1;
  // CheckpointDir is an absolute caller-owned output directory.
  string checkpoint_dir = 2;
  // Timeout is the checkpoint deadline duration in nanoseconds.
  int64 timeout = 3;
  // Compress enables checkpoint artifact compression when true.
  bool compress = 4;
  // TraceID is an optional distributed trace ID.
  string trace_id = 5;
  string checkpoint_id = 6;
  bool leave_running = 7;
  bool include_filesystem = 8;
  // Upstream checkpoint contract, renumbered: our wire pins 3-8.
  uint32 timeout_seconds = 9;
  string snapshot_type = 10;

}

// CheckpointResponse is returned after sandbox checkpoint.
message CheckpointIfGenerationRequest {
  CheckpointRequest checkpoint = 1;
  string expected_generation = 2;
}

message CheckpointResponse {
  bool   success = 1;
  string message = 2;
  string artifact_path = 3;
  int64 artifact_size = 4;
  string artifact_sha256 = 5;
  // Physical lifetime bound to the published source manifest; empty for legacy artifacts.
  string source_generation = 6;
}
a of a sandbox.
